<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clue (CheerpJ)</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
      html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #222; }
      a.back-btn {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1000;
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        font-family: 'Helvetica Neue', sans-serif;
        font-size: 0.85em;
        font-weight: bold;
        text-decoration: none;
      }
      a.back-btn:hover { background: rgba(0, 0, 0, 0.8); }
      #game-over {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.75);
      }
      #game-over.show { display: flex; }
      #game-over p {
        color: white;
        font-family: 'Helvetica Neue', sans-serif;
        font-size: 1.1em;
        margin: 0 0 4px;
      }
      #game-over button, #game-over a {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: white;
        color: #222;
        font-family: 'Helvetica Neue', sans-serif;
        font-size: 0.9em;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
      }
      #game-over button:hover, #game-over a:hover { background: #ddd; }
    </style>
  </head>
  <body>
    <a href="../projects.html" class="back-btn">&larr; Projects</a>
    <div id="cheerpj-container" style="position: fixed; inset: 0;"></div>
    <div id="game-over">
      <p>Game over</p>
      <button onclick="location.reload()">Play Again</button>
      <a href="../index.html">Return Home</a>
    </div>
    <script>
      (async function () {
        const gameOverEl = document.getElementById("game-over");
        let shown = false;
        const showGameOver = () => {
          if (shown) return;
          shown = true;
          gameOverEl.classList.add("show");
        };

        await cheerpjInit({
          version: 17,
          javaProperties: ["clue.dataDir=/app/clue-game/Data", "clue.responsiveLayout=true"],
        });
        const display = cheerpjCreateDisplay(-1, -1, document.getElementById("cheerpj-container"));

        // The game may dispose() its window on win/loss without calling
        // System.exit(), so cheerpjRunMain's promise never resolves in that
        // case. Watch for the .cjWindow element CheerpJ renders per open
        // JFrame (the display container also holds permanent helper nodes
        // that never go away, so child count alone can't signal "closed").
        let windowSeen = false;
        const observer = new MutationObserver(() => {
          const hasWindow = display.querySelector(".cjWindow") !== null;
          if (hasWindow) {
            windowSeen = true;
          } else if (windowSeen) {
            observer.disconnect();
            showGameOver();
          }
        });
        observer.observe(display, { childList: true, subtree: true });

        const exitCode = await cheerpjRunMain("clueGame.ClueGameFrame", "/app/clue-game/ClueGame.jar");
        console.log("ClueGameFrame exited with code", exitCode);
        observer.disconnect();
        showGameOver();
      })();
    </script>
  </body>
</html>
